[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi_wnn"
version = "1.0.0"
authors = [
    { name = "t4rxnn-devel" }
]
description = "A pure, bit-packed Physics-Informed Weightless Neural Network engine based on the WiSARD memory paradigm."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware"
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "encoder*", "wisard_engine*", "tests*", "pipeline*"]
