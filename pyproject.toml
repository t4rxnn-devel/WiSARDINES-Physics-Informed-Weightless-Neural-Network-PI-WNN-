[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi_wnn"
version = "1.4.0"
authors = [
    { name = "t4rxnn-devel" }
]
description = "A pure, bit-packed Physics-Informed Weightless Neural Network engine based on the WiSARD memory paradigm."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware"
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0"
]

[project.optional-dependencies]
baselines = ["torch>=2.0", "xgboost>=2.0"]

[tool.setuptools]
py-modules = ["config", "encoder", "wisard_engine", "pipeline", "windowing", "physics_simulators", "hardware_profile", "real_data", "cuckoo_table", "tests", "main"]
